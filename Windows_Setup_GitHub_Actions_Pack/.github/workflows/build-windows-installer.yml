name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Interactive_Axial_Pile_Capacity_Calculator" `
            --add-data "PTTEP_Logo.svg.png;." `
            main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found."
          }
          & $iscc "installer.iss"

      - name: Upload Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Interactive-Axial-Pile-Capacity-Calculator-Setup
          path: installer_output/Interactive_Axial_Pile_Capacity_Calculator_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Interactive-Axial-Pile-Capacity-Calculator-Portable
          path: dist/Interactive_Axial_Pile_Capacity_Calculator.exe
          if-no-files-found: error
          retention-days: 30
